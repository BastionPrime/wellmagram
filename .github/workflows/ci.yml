name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    name: flutter analyze + flutter test (Dart unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Pin Flutter SDK path expected by pubspec override
        run: |
          # pubspec.yaml dependency_overrides points the flutter package at
          # /opt/flutter; in CI the SDK lives where the action installed it.
          # Symlink to keep the override resolvable without editing pubspec.
          SDK="$(dirname "$(dirname "$(which flutter)")")"
          sudo mkdir -p /opt
          sudo ln -sfn "$SDK" /opt/flutter

      - name: Flutter doctor (environment record)
        run: flutter doctor -v

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test (unit tests only)
        run: flutter test
