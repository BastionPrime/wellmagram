name: wellmagram
description: A multi-account messenger for MAX and Telegram on Android.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.10.4
  flutter: ^3.38.5

dependencies:
  # TDLib FFI adapter (OPE-2568 Шаг 2): utf8 <-> native char* helpers.
  ffi: ^2.1.0
  # @visibleForTesting seams in td_ffi_client.dart (was a transitive-only
  # import before; direct use belongs in direct dependencies).
  meta: ^1.16.0
  # Shared preferences is resolved by `flutter pub get` in the build image
  # (plugin requires the Flutter SDK); the core module keeps a thin seam
  # (AccountsStore.usePrefsLoader) so unit tests never touch the plugin.
  # shared_preferences: ^2.5.4
  rxdart: ^0.27.7

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # lib/main.dart imports the Flutter SDK package; declared via the section
  # above rather than a plain dependency (workspace-internal resolution, see
  # dependency_overrides note below).

dependency_overrides:
  # The Flutter SDK package is a workspace-internal package (resolution:
  # workspace) and is never resolvable from pub.dev; the build image provides
  # it via the SDK. This override is the standard way Flutter app repos pin it.
  flutter:
    path: /opt/flutter/packages/flutter
